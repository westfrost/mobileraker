name: mobileraker_pro
description: Personal re-implementation of the Mobileraker Pro module (Spoolman, job queue, printer groups, custom themes, gcode preview). Written from scratch for a personal, non-commercial build.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  common:
    path: ../common
  firebase_core: ^4.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  hive_ce: ^2.8.0+1
  hive_ce_flutter: ^2.1.0
  easy_localization: ^3.0.3
  collection: ^1.19.0
  uuid: ^4.5.2
  go_router: ^17.3.0
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.1.2
  form_builder_extra_fields: ^12.0.0
  flutter_vector_icons: ^2.0.0
  flex_color_scheme: ^8.2.0
  google_fonts: ^8.0.2
  flutter_svg_provider: ^1.0.7
  flutter_svg: ^2.2.4
  smooth_sheets: ^1.0.3
  shimmer: ^3.0.0
  vector_math: ^2.1.4
  mobile_scanner: ^7.4.0
  file_picker: ^11.0.2
  path_provider: ^2.1.0
  webview_flutter: ^4.4.0
  webview_flutter_android: any
  dio: ^5.8.0+1
  rxdart: ^0.28.0
  intl: any
  google_mobile_ads: ^9.0.0

dev_dependencies:
  build_runner: ^2.6.0
  freezed: ^3.2.0
  json_serializable: ^6.9.5
  riverpod_generator: ^4.0.4
  hive_ce_generator: ^1.8.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
