name: Personal build

on:
  push:
    branches: [premium]
  workflow_dispatch:

concurrency:
  group: personal-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dummy Firebase config (no Firebase project behind this build)
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "mobileraker-personal",
              "storage_bucket": "mobileraker-personal.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.mobileraker.personal" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDUMMY-personal-build-0000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Prepare logs dir
        run: mkdir -p ci-out

      - name: Generate code (common, pro, app)
        run: |
          ( cd common && flutter pub get && dart run build_runner build --delete-conflicting-outputs ) > ci-out/01-common.log 2>&1 || echo "STEP FAILED" >> ci-out/01-common.log
          ( cd pro && flutter pub get && dart run build_runner build --delete-conflicting-outputs ) > ci-out/02-pro.log 2>&1 || echo "STEP FAILED" >> ci-out/02-pro.log
          ( flutter pub get && dart run build_runner build --delete-conflicting-outputs ) > ci-out/03-app.log 2>&1 || echo "STEP FAILED" >> ci-out/03-app.log
          tail -5 ci-out/0*.log || true
          exit 0

      - name: Unit tests (pro module)
        if: always()
        run: |
          ( cd pro && flutter test ) > ci-out/035-tests.log 2>&1 || echo "TESTS FAILED" >> ci-out/035-tests.log

      - name: Analyze
        if: always()
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib pro/lib 2>&1 | grep -E "error •|error -" > ci-out/04-analyze-errors.log || true
          flutter analyze --no-fatal-infos lib pro/lib > ci-out/04-analyze-full.log 2>&1 || true
          echo "errors: $(wc -l < ci-out/04-analyze-errors.log)"

      - name: Build APK
        id: apk
        if: always()
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm,android-x64 2>&1 | tail -300 | tee ci-out/05-build.log
          ls -la build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ci-out/mobileraker-plus.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ci-out/mobileraker-plus-32bit.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ci-out/mobileraker-plus-x86_64.apk

      - name: Enable KVM for the emulator
        if: always() && steps.apk.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        if: always() && steps.apk.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke_test.sh

      - name: Publish APK as release
        if: always() && steps.apk.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="personal-latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" ci-out/mobileraker-plus.apk ci-out/mobileraker-plus-32bit.apk \
            --title "Mobileraker+ (personlig build)" \
            --notes "Bygget fra commit ${GITHUB_SHA::7}. Installér mobileraker-plus.apk på telefonen (mobileraker-plus-32bit.apk kun til meget gamle telefoner)." \
            --target "$GITHUB_SHA" --latest

      - name: Push logs to ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "sha=${GITHUB_SHA}" > ci-out/00-status.txt
          echo "apk=${{ steps.apk.outcome }}" >> ci-out/00-status.txt
          echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> ci-out/00-status.txt
          rm -f ci-out/*.apk
          mkdir -p ci-out/gen && (cd pro/lib && find . -name "*.g.dart" -exec cp --parents {} ../../ci-out/gen/ \;) || true
          cd ci-out
          git init -q -b ci-logs
          git config user.name ci && git config user.email ci@localhost
          git add -A && git commit -qm "logs ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
